# Builds a tackle2-hub image from an arbitrary fork/ref — used to test the
# UI's shim→hub migration against Jeff's agent-endpoints branch on ROKS
# (amd64-only: the demo cluster's workers are amd64; native runner avoids
# the QEMU/UBI dnf TLS failure documented in build-images.yml).
name: build-hub
on:
  workflow_dispatch:
    inputs:
      hub_repo:
        description: "tackle2-hub repo (owner/name)"
        default: "jortel/tackle2-hub"
      hub_ref:
        description: "branch / SHA to build"
        default: "agentic"
      tag:
        description: "image tag to push"
        default: "agentic"
  push:
    paths:
      - ".github/workflows/build-hub.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.hub_repo || 'jortel/tackle2-hub' }}
          ref: ${{ github.event.inputs.hub_ref || 'agentic' }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tackle2-hub:${{ github.event.inputs.tag || 'agentic' }}
      - name: print digest
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/tackle2-hub:${{ github.event.inputs.tag || 'agentic' }} | head -5
