# Build ONLY the agentic-controller image from a given ref and publish it
# as ghcr.io/<owner>/agentic-controller:<tag> (multi-arch, native legs +
# one manifest) — for trying a controller branch/PR on a cluster without
# re-cutting the agent images the way build-images.yml does.
#
# Usage:
#   gh workflow run build-controller.yml -f controller_ref=<branch|sha> -f tag=<tag>
# then resolve the digest with
#   docker buildx imagetools inspect ghcr.io/<owner>/agentic-controller:<tag>
name: build-controller

on:
  workflow_dispatch:
    inputs:
      controller_ref:
        description: agentic-controller ref (branch, tag or sha) to build from
        default: main
      tag:
        description: image tag to publish under ghcr.io/<owner>/agentic-controller
        default: dev
      controller_repo:
        description: owner/repo to check the ref out from
        default: ""  # empty = <owner>/agentic-controller

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  TAG: ${{ inputs.tag }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.controller_repo || format('{0}/agentic-controller', github.repository_owner) }}
          ref: ${{ inputs.controller_ref }}
          path: controller

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build agentic-controller
        uses: docker/build-push-action@v6
        with:
          context: controller
          file: controller/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/agentic-controller:${{ env.TAG }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.controller_ref }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t "$REGISTRY/agentic-controller:$TAG" \
            "$REGISTRY/agentic-controller:$TAG-amd64" \
            "$REGISTRY/agentic-controller:$TAG-arm64"

      - name: Show digest
        run: docker buildx imagetools inspect "$REGISTRY/agentic-controller:$TAG" | head -5
