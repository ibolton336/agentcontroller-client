# ci/tee-agent-images variant: build ONLY the agent images (where the
# harness lives) from the ACP-tee branch, tagged :tee so the running
# :demo stack is untouched. The controller/gateway/ui images must NOT be
# rebuilt from this ref — upstream main renamed the API to AgentWorkflow
# while the deployed stack (CRDs, gateway, UI) still speaks AgentWorkload;
# the tee changes nothing outside harness/, so agent images are the whole
# delta.
#
# Each arch builds NATIVELY (amd64 on ubuntu-latest, arm64 on
# ubuntu-24.04-arm), so the emulated-UBI10 `dnf` TLS failure under QEMU
# never comes up. A final job stitches the per-arch tags into one :tee
# manifest.
name: build-images

# The push trigger (scoped to this file) exists because workflow_dispatch
# only registers off the default branch — editing this file on any branch
# starts a build with the default refs.
on:
  push:
    paths:
      - .github/workflows/build-images.yml
  workflow_dispatch:
    inputs:
      controller_ref:
        description: agentic-controller ref to build from
        default: feat/harness-acp-tee
      tag:
        description: image tag to push
        default: tee

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  TAG: ${{ inputs.tag || 'tee' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: client

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/agentic-controller
          ref: ${{ inputs.controller_ref || 'feat/harness-acp-tee' }}
          path: controller

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same context build-images.sh stages: four core skills from the
      # controller repo, patternfly-migration from this one.
      - name: Stage agent-java context
        run: |
          mkdir -p stage/agent-java/skills
          for s in plan execute verify javaee-to-quarkus; do
            cp -R "controller/skills/$s" stage/agent-java/skills/
          done
          cp -R client/skills/patternfly-migration stage/agent-java/skills/
          cp client/deploy/roks/agent-java.Containerfile stage/agent-java/Containerfile

      - name: Build agent-base
        uses: docker/build-push-action@v6
        with:
          context: controller
          file: controller/images/agent-base/Containerfile
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/agent-base:${{ env.TAG }}-${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # Layers on the agent-base pushed moments ago, same arch.
      - name: Build agent-java
        uses: docker/build-push-action@v6
        with:
          context: stage/agent-java
          file: stage/agent-java/Containerfile
          push: true
          provenance: false
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/agent-base:${{ env.TAG }}-${{ matrix.arch }}
          tags: ${{ env.REGISTRY }}/agent-java:${{ env.TAG }}-${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # agent-go for the golang-cve-manager workflow (RHDH upgrade demo).
      - name: Build agent-go
        uses: docker/build-push-action@v6
        with:
          context: controller
          file: controller/images/agent-go/Containerfile
          push: true
          provenance: false
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/agent-base:${{ env.TAG }}-${{ matrix.arch }}
          tags: ${{ env.REGISTRY }}/agent-go:${{ env.TAG }}-${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  # Stitch the two per-arch tags into the one :tee tag the manifests use.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        run: |
          for img in agent-base agent-java agent-go; do
            docker buildx imagetools create \
              -t "$REGISTRY/$img:$TAG" \
              "$REGISTRY/$img:$TAG-amd64" \
              "$REGISTRY/$img:$TAG-arm64"
          done

      - name: Show digests
        run: |
          for img in agent-base agent-java agent-go; do
            docker buildx imagetools inspect "$REGISTRY/$img:$TAG" | head -5
            echo
          done
