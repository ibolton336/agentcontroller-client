# AgentWorkflowRun for the ROKS cluster `demo-agentic-controller` ONLY.
# On its Hub, coolstore is application id 1. Dylan-mta uses
# runs/coolstore-run-dylan-mta.yaml (app id 2, different branch).
# Spec is immutable; gateway + env are copied to ALL stages. Fresh run =
# new metadata.name + new TARGET_BRANCH.
apiVersion: konveyor.io/v1alpha1
kind: AgentWorkflowRun
metadata:
  name: coolstore-quarkus-roks-1
  namespace: konveyor-agents
  labels:
    konveyor.io/managed: "true"
spec:
  workflowRef: coolstore-quarkus-demo
  # gateway may be omitted (the stage Agent declares exactly one and the
  # controller defaults to it); explicit here to make the model visible.
  gateway: bedrock-sonnet
  params:
    - name: max_turns
      value: "150"                         # declared on the (single) Agent, so valid for every stage
  env:                                     # copied verbatim to every stage pod, appended last
    - name: HUB_BASE_URL
      value: http://tackle-hub.konveyor-tackle.svc:8080
    - name: APP_ID
      value: "1"                           # coolstore on the ROKS Hub
    - name: TARGET_BRANCH
      value: quarkus-migration-roks-1      # ONE branch for all three stages; must differ from the Hub source branch (main); fresh per attempt
