# Real goose harness wired to AWS Bedrock.
# The aws-bedrock-creds secret is created separately (see README) so
# credentials never land in this file.
---
# One Gateway = one provider/model endpoint (post-#100). spec.provider is
# the runtime provider id, injected as KONVEYOR_LLM_PROVIDER; the harness
# maps it onto GOOSE_PROVIDER ("aws-bedrock" -> aws_bedrock). The keyless
# credentialRef exposes the whole Secret via envFrom (AWS SigV4 spans
# multiple env vars).
apiVersion: konveyor.io/v1alpha1
kind: Gateway
metadata:
  name: bedrock-sonnet
  namespace: konveyor-agents
spec:
  provider: aws-bedrock
  endpoint: "https://bedrock-runtime.us-east-1.amazonaws.com"
  credentialRef:
    secretName: aws-bedrock-creds
  model:
    name: "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
    contextWindow: 200000
    tier: primary
---
apiVersion: konveyor.io/v1alpha1
kind: Gateway
metadata:
  name: bedrock-haiku
  namespace: konveyor-agents
spec:
  provider: aws-bedrock
  endpoint: "https://bedrock-runtime.us-east-1.amazonaws.com"
  credentialRef:
    secretName: aws-bedrock-creds
  model:
    name: "global.anthropic.claude-haiku-4-5-20251001-v1:0"
    contextWindow: 200000
    tier: efficient
---
apiVersion: konveyor.io/v1alpha1
kind: Agent
metadata:
  name: migration-analyzer-goose
  namespace: konveyor-agents
  labels:
    konveyor.io/managed: "true"
  annotations:
    # Platform-resolved params (ADR 0005) — same contract as the mock agent.
    konveyor.io/param-sources: |
      {"repository": "konveyor.io/application-repository-url",
       "branch": "konveyor.io/application-repository-branch"}
    konveyor.io/credential-sources: |
      {"git": "konveyor.io/application-identity"}
spec:
  image: "goose-harness:dev"
  prompt: |
    You are a migration analysis agent. The application source is checked
    out at /workspace. Answer questions about it concisely.
  # Single declared gateway: runs may omit spec.gateway and the controller
  # defaults to it. bedrock-haiku exists as an explicit-selection option
  # for agents that declare it.
  gateways:
    - ref: bedrock-sonnet
  params:
    - name: repository
      type: string
      description: Git URL of the application repository
      required: true
    - name: branch
      type: string
      description: Branch to analyze
      default: main
