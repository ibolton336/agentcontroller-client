apiVersion: konveyor.io/v1alpha1
kind: AgentRun
metadata:
  generateName: real-
  namespace: konveyor-agents
spec:
  agentRef: migration-analyzer-goose
  params:
  - name: repository
    value: https://github.com/konveyor-ecosystem/coolstore
  - name: branch
    value: main
  # No gateway: the agent declares exactly one (bedrock-sonnet) and the
  # controller defaults to it. To pin a different model, declare that
  # Gateway on the agent and set spec.gateway here.
  env:
  - name: GOOSE_MODE
    value: auto
